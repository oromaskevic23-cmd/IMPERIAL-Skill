[build-system]
requires = ["setuptools>=70,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperial-skill"
version = "0.2.0"
description = "IMPERIAL Core Enterprise Skills: federated, evidence-first security and certification framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexander Nikolaevich Romaskevich" }]
license = { file = "LICENSE.md" }
dependencies = ["cryptography>=44,<48"]

[project.scripts]
imperial-skill = "imperial_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imperial_skill = ["py.typed"]
