name: IMPERIAL Skill - Enterprise Security & Contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperial-skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-and-contracts:
    name: Python ${{ matrix.python-version }} - security & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and inspect dependencies
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Python syntax
        run: python -m compileall -q src tests tools
      - name: Test federation, credentials, exam and safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate manifest-exam provenance and dependency graph
        run: python tools/verify_examples.py
      - name: Execute bounded local skill pipeline demo
        run: python tools/demo_federation.py
      - name: CLI smoke tests
        run: |
          imperial-skill validate examples/skills/code-review.json
          imperial-skill plan --directory examples/skills --tenant imperial-internal --orchestrator engineering-orch --domain CODE_ENGINEERING --skill-id imperial.skill.code-draft --version 0.1.0
          imperial-skill exam-grade examples/exams/code-review.json examples/exams/code-review-responses.json
  cross-repository-plugin-contract:
    name: IMPERIAL-Plugins pinned contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout IMPERIAL-Skill
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout pinned IMPERIAL-Plugins source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: oromaskevic23-cmd/IMPERIAL-Plugins
          ref: c983d81d1d2f7385bebd416e90909c5ae0d9d1eb
          path: pinned-plugins
          persist-credentials: false
      - name: Verify real plugin manifest validator compatibility
        run: PYTHONPATH=src:pinned-plugins/src python tools/test_plugins_bridge.py
  rights-and-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: License, author and private key policy
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE.md
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          grep -Fq "Alexander Nikolaevich Romaskevich" LICENSE.md
          grep -Fq "Founder" README.md
          if git ls-files | grep -Ei '(^|/)(\.env|id_rsa|.*private.*\.pem|.*secret.*\.key|wallet-key)$'; then
            echo "PRIVATE_MATERIAL_COMMITTED" >&2
            exit 1
          fi
          echo "RIGHTS_AND_PRIVATE_KEY_BOUNDARY_PASS"
